name: Deploy frontend to EC2

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you also trigger this manually from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" '
            set -e
            cd ~/isdi_projects/fullstack_app/frontend
            git pull origin main
            cd ~/isdi_projects/fullstack_app
            docker compose --env-file .env.production up --build -d frontend
          '
